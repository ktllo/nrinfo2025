<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/css/main.css">
    <title>Change Password</title>
    <script th:replace="~{fragments/basic.html :: jquery}"></script>
    <script src="/scripts/main.js"></script>
    <script>
        function validateForm() {
            var ok = true;
            return ok;
        }
    </script>
</head>
<body>
<h1>Change Password</h1>
<div th:replace="~{fragments/basic.html :: header}"></div>
<div class="error" th:if="${error_message}" th:text="${error_message}"></div>
<form th:action="@{/change_password}" method="post" onsubmit="return validateForm()">
    <input type="hidden" id="destination" name="destination" th:value="${destination}" th:if="${destination!=null}"/>
    <table>
        <tr>
            <th><label for="old_password">Old Password</label></th>
            <td><input type="password" name="old_password" id="old_password"></td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <th><label for="new_password">New Password</label></th>
            <td><input type="password" name="new_password" id="new_password"></td>
            <td><span id="emPass" th:text="${emPass}"></span></td>
        </tr>
        <tr>
            <th><label for="confirm_password">Confirm Password</label></th>
            <td><input type="password" name="confirm_password" id="confirm_password"></td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <td colspan="3"><input type="submit" value="Change password"></td>
        </tr>
    </table>
</form>
<div th:replace="~{fragments/basic.html :: footer}"></div>
</body>
</html>
