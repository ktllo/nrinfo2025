<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/css/main.css">
    <title>Report list</title>
    <script th:replace="~{fragments/basic.html :: jquery}"></script>
    <script src="/scripts/main.js"></script>
</head>
<body>
<h1>Report list</h1>
<div th:replace="~{fragments/basic.html :: header}"></div>
<th:block th:each="report_group : ${report_groups}">
    <h2 th:text="${report_group.reportGroupName}"></h2>
    <ul th:each="report : ${report_group.reports}">
        <li><a th:href="${'report/'+report.reportId()}"><span th:text="${report.reportId()}"></span> - <span th:text="${report.reportName()}"></span></a></li>
    </ul>
</th:block>
</body>
</html>
